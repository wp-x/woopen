version: '3.8'

services:
  woopen:
    build: .
    container_name: woopen
    ports:
      - "10010:10010"
    volumes:
      - ./data:/data
    environment:
      - WOOPEN_ADMIN_PASSWORD=your_secure_password
      - WOOPEN_SITE_URL=https://your-domain.com
      - TZ=Asia/Shanghai
    restart: unless-stopped
